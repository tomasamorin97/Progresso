<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Progresso">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Progresso</title>
<style>
:root{--bg:#0d0f12;--c:#171a1f;--c2:#1f242b;--t:#eef1f4;--m:#8b95a1;--a:#4cc9f0;--r:#ff6b6b;--b:#2a3038}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
#app{padding:calc(14px + env(safe-area-inset-top)) 16px 120px;max-width:640px;margin:auto}
h1{font-size:26px;margin:8px 0 14px;font-weight:750;letter-spacing:-.4px}h2{font-size:18px;margin:20px 0 8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.g{flex:1}
.m{color:var(--m);font-size:14px}
button{font:inherit;color:var(--t);background:var(--c2);border:1px solid var(--b);border-radius:12px;min-height:48px;padding:0 16px}
button:active{opacity:.7}
.p{background:var(--a);color:#06222b;font-weight:700;border:0}.d{color:var(--r)}
.big{width:100%;min-height:54px;font-size:17px;margin:0 0 8px}
input,select,textarea{font:inherit;color:var(--t);background:var(--c2);border:1px solid var(--b);border-radius:12px;min-height:48px;padding:0 12px;width:100%}
textarea{padding:10px;min-height:120px}
label{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111418;border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--m);font-size:12px;min-height:58px;padding:0}nav .on{color:var(--a);font-weight:700}
.chip{display:inline-block;padding:8px 13px;border-radius:20px;background:var(--c2);border:1px solid var(--b);margin:0 6px 6px 0;font-size:14px}.chip.on{background:var(--a);color:#06222b;border-color:var(--a)}
.tag{font-size:11px;background:#3a3320;color:#ffd24d;padding:2px 7px;border-radius:6px;margin-left:6px;font-weight:600}
.set{display:grid;grid-template-columns:26px 1fr 1fr 54px;gap:8px;margin:6px 0;align-items:center}
.set button{padding:0}.ok{background:var(--a);color:#06222b;border:0}
#rest{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--a);color:#06222b;border-radius:14px;padding:12px 16px;display:none;font-weight:700;justify-content:space-between;align-items:center;z-index:5}
#rest button{min-height:36px;background:#06222b;color:var(--a);border:0}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:9}
.modal>div{background:var(--c);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sel{border-color:var(--a)}
svg text{fill:var(--m);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--b);text-align:left}
</style></head><body>
<div id="app"></div><div id="rest"></div>
<nav id="nav"></nav>
<script>
"use strict";
/* ===== Base de datos local (IndexedDB) ===== */
const STORES=['ex','rt','wk','meta'];let db;
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('gym-app',1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)});
const tx=(s,m,f)=>new Promise((ok,no)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,id)=>tx(s,'readwrite',o=>o.delete(id)),clear=s=>tx(s,'readwrite',o=>o.clear());
const sv=(s,v)=>put(s,v).catch(e=>alert('No se pudo guardar: '+(e&&e.message||e)+'\nHacé una copia de seguridad cuanto antes.'));
/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const p2=n=>String(n).padStart(2,'0'),ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const DIA=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fd=s=>{const[y,m,d]=s.split('-');return `${+d} de ${MES[m-1]} de ${y}`};
const mname=ym=>MES[+ym.slice(5)-1]+' de '+ym.slice(0,4);
const num=v=>{v=parseFloat(String(v).replace(',','.'));return isFinite(v)&&v>=0?v:0};
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fm=s=>Math.max(1,Math.round(s/60))+' min';
const f1=n=>n>=10000?(n/1000).toFixed(1)+'k':String(Math.round(n*10)/10);
const GR=['Pecho','Espalda','Piernas','Hombros','Bíceps','Tríceps','Core','Otros'];
const toast=t=>alert(t);
/* ===== Datos iniciales (biblioteca y rutinas de ejemplo) ===== */
const SEED=`Press de banca con barra|Pecho|Pecho, tríceps, hombro anterior|Acostado, bajá la barra al pecho con control y empujá hasta extender los codos.|Rebotar la barra, despegar la cadera, codos muy abiertos.
Press inclinado con mancuernas|Pecho|Pecho superior, hombro, tríceps|En banco inclinado, empujá las mancuernas hacia arriba y bajá hasta sentir estiramiento.|Inclinar demasiado el banco, bajar sin control.
Aperturas con mancuernas|Pecho|Pecho|Con codos levemente flexionados, abrí los brazos y cerrá como un abrazo.|Estirar demasiado el hombro, usar demasiado peso.
Flexiones|Pecho|Pecho, tríceps, core|Cuerpo en línea recta, bajá el pecho al suelo y empujá.|Hundir la cadera, codos muy abiertos.
Dominadas|Espalda|Dorsal, bíceps|Colgado de la barra, llevá el mentón por encima de ella sin balanceo.|Balancearse, no bajar completo.
Remo con barra|Espalda|Dorsal, trapecio, bíceps|Torso inclinado y espalda neutra, llevá la barra hacia el abdomen.|Redondear la espalda, tirar con los brazos.
Jalón al pecho|Espalda|Dorsal, bíceps|Sentado, tirá la barra hacia la parte alta del pecho.|Inclinarse hacia atrás, jalar tras la nuca.
Remo con mancuerna|Espalda|Dorsal, bíceps|Apoyado en un banco, llevá la mancuerna hacia la cadera.|Girar el torso, tirones bruscos.
Sentadilla con barra|Piernas|Cuádriceps, glúteos|Bajá con la espalda neutra hasta la profundidad cómoda y subí empujando el suelo.|Rodillas hacia adentro, talones levantados.
Peso muerto rumano|Piernas|Isquiotibiales, glúteos, espalda baja|Llevá la cadera atrás con rodillas semiflexionadas y la barra pegada al cuerpo.|Redondear la espalda, alejar la barra.
Prensa de piernas|Piernas|Cuádriceps, glúteos|Bajá la plataforma controlada y empujá sin bloquear las rodillas.|Despegar la cadera, rango muy corto.
Zancadas|Piernas|Cuádriceps, glúteos|Da un paso largo y bajá la rodilla trasera hacia el suelo.|Paso corto, rodilla hacia adentro.
Curl femoral|Piernas|Isquiotibiales|Flexioná las rodillas llevando el talón hacia los glúteos.|Levantar la cadera, usar impulso.
Elevación de talones|Piernas|Gemelos|De pie, subí sobre las puntas con pausa arriba y bajá completo.|Rebotar, rango corto.
Press militar|Hombros|Hombros, tríceps|De pie, empujá la barra sobre la cabeza con el abdomen firme.|Arquear la espalda baja, empujar con las piernas.
Elevaciones laterales|Hombros|Deltoides lateral|Subí las mancuernas hacia los lados hasta la altura del hombro.|Usar impulso, subir los hombros.
Face pull|Hombros|Deltoides posterior, trapecio|Tirá la cuerda hacia la cara abriendo los codos.|Demasiado peso, echarse hacia atrás.
Curl de bíceps con barra|Bíceps|Bíceps|Flexioná los codos subiendo la barra sin mover los codos del costado.|Balancear el torso.
Curl martillo|Bíceps|Bíceps, antebrazo|Con agarre neutro, subí la mancuerna sin girar la muñeca.|Impulso, codos adelantados.
Extensión de tríceps en polea|Tríceps|Tríceps|Codos pegados al cuerpo, extendé hasta abajo y volvé controlado.|Abrir los codos, inclinarse sobre la barra.
Fondos en paralelas|Tríceps|Tríceps, pecho|Bajá con control hasta unos 90° de codo y empujá.|Bajar demasiado, hombros caídos hacia adelante.
Plancha|Core|Abdomen, glúteos|Apoyado en antebrazos, cuerpo recto y abdomen firme.|Hundir la cadera, subir demasiado la cadera.
Crunch abdominal|Core|Recto abdominal|Enrollá el torso hacia las rodillas sin tirar del cuello.|Tirar del cuello, usar impulso.`;
const TPL=[
{n:'Empuje (pecho, hombro, tríceps)',g:'Empuje',ex:[['Press de banca con barra',4,8],['Press inclinado con mancuernas',3,10],['Press militar',3,10],['Elevaciones laterales',3,15],['Extensión de tríceps en polea',3,12]]},
{n:'Tracción (espalda, bíceps)',g:'Tracción',ex:[['Dominadas',4,6],['Remo con barra',4,8],['Jalón al pecho',3,10],['Face pull',3,15],['Curl de bíceps con barra',3,10]]},
{n:'Piernas',g:'Piernas',ex:[['Sentadilla con barra',4,8],['Peso muerto rumano',3,10],['Prensa de piernas',3,12],['Curl femoral',3,12],['Elevación de talones',4,15]]},
{n:'Cuerpo completo',g:'Full body',ex:[['Sentadilla con barra',3,8],['Press de banca con barra',3,8],['Remo con barra',3,8],['Press militar',3,10],['Crunch abdominal',3,15]]}];
/* ===== Estado ===== */
let S={ex:[],rt:[],wk:[],act:null,cfg:{id:'cfg'}},V={t:'home'},D=null,X=null,P=null,R={end:0},BK=null;
const exOf=id=>S.ex.find(e=>e.id==id);
const tplEx=t=>t.ex.map(([n,s,r])=>{const e=S.ex.find(x=>x.name==n);return{eid:e?e.id:null,n,s,r,w:0}});
const mkRt=(t,demo)=>({id:uid(),name:t.n,tag:t.g,days:[],ex:tplEx(t),imgs:[],demo:!!demo});
async function init(){
 try{await open()}catch(e){document.body.innerHTML='<p style="padding:20px">Este navegador no permite guardar datos locales. Abrí la app en Safari.</p>';return}
 [S.ex,S.rt,S.wk]=await Promise.all([all('ex'),all('rt'),all('wk')]);
 const m=await all('meta');S.cfg=m.find(x=>x.id=='cfg')||{id:'cfg'};S.act=m.find(x=>x.id=='act')||null;
 if(!m.find(x=>x.id=='seeded')){
  SEED.split('\n').forEach((l,i)=>{const[n,g,mu,d,e]=l.split('|');S.ex.push({id:'s'+i,name:n,group:g,muscles:mu,desc:d,errors:e})});
  TPL.forEach(t=>S.rt.push(mkRt(t,true)));
  await Promise.all([...S.ex.map(e=>put('ex',e)),...S.rt.map(r=>put('rt',r)),put('meta',{id:'seeded'})]);
 }
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if(S.act)V={t:'wo',n:'home'};
 render();setInterval(tick,500);
}
function go(t,x){V=Object.assign({t},x||{});render();scrollTo(0,0)}
function render(){
 const NV=[['home','Inicio'],['rt','Rutinas'],['lib','Ejercicios'],['hist','Historial'],['prog','Progreso']];
 $('#nav').innerHTML=NV.map(([k,l])=>`<button class="${(V.n||V.t)==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#app').innerHTML=(views[V.t]||views.home)();
}
/* ===== Ventanas modales ===== */
function modal(h){let m=$('#mo');if(!m){m=document.createElement('div');m.id='mo';m.className='modal';m.onclick=e=>{if(e.target===m)closeM()};document.body.appendChild(m)}m.innerHTML=`<div>${h}</div>`}
const closeM=()=>{const m=$('#mo');if(m)m.remove()};
/* ===== Estadísticas (cálculo local) ===== */
const W2=(w,e)=>w*(e.pm?2:1);
const wvol=w=>w.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.done?W2(s.w,e)*s.r:0),0),0);
function rows(){const o=[];S.wk.forEach(w=>w.ex.forEach(e=>e.sets.forEach(s=>{if(s.done&&s.r>0){const tw=W2(s.w,e);o.push({d:w.d,wid:w.id,eid:e.eid||e.n,n:e.n,g:(exOf(e.eid)||{}).group||'Otros',w:tw,r:s.r,v:tw*s.r,rt:w.name})}})));return o}
function sess(R,id){const m={};for(const x of R)if(x.eid==id){const s=m[x.wid]||(m[x.wid]={d:x.d,mw:0,rr:0,v:0,n:0});s.mw=Math.max(s.mw,x.w);s.v+=x.v;s.rr+=x.r;s.n++}return Object.values(m).sort((a,b)=>a.d<b.d?-1:1)}
function monday(d){const t=new Date(d+'T00:00');t.setDate(t.getDate()-(t.getDay()+6)%7);return ymd(t)}
const lastWeeks=n=>{const t=new Date(monday(ymd(new Date()))+'T00:00');return Array.from({length:n},(_,i)=>{const x=new Date(t);x.setDate(x.getDate()-7*(n-1-i));return ymd(x)})};
const lastMonths=n=>{const t=new Date();return Array.from({length:n},(_,i)=>ymd(new Date(t.getFullYear(),t.getMonth()-(n-1-i),1)).slice(0,7))};
const prevM=ym=>ymd(new Date(+ym.slice(0,4),+ym.slice(5)-2,1)).slice(0,7);
function trend(R,id){const s=sess(R,id);if(s.length<4)return null;const rec=Math.max(s[s.length-1].mw,s[s.length-2].mw),old=Math.max(...s.slice(0,-2).map(x=>x.mw));return rec>old?'up':'flat'}
function line(P,u){if(P.length<2)return '<p class="m">Aún no hay suficientes registros para graficar (se necesitan al menos 2 sesiones).</p>';
 const W=320,H=130,mx=Math.max(...P.map(p=>p.v)),mn=Math.min(...P.map(p=>p.v)),rg=(mx-mn)||1,X=i=>24+i*(W-40)/(P.length-1),Y=v=>H-24-(v-mn)/rg*(H-48);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="#4cc9f0" stroke-width="2" points="${P.map((p,i)=>X(i)+','+Y(p.v)).join(' ')}"/>${P.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="3" fill="#4cc9f0"/>`).join('')}<text x="2" y="12">${f1(mx)}${u}</text><text x="2" y="${H-14}">${f1(mn)}${u}</text><text x="20" y="${H-2}">${P[0].l}</text><text x="${W-44}" y="${H-2}">${P[P.length-1].l}</text></svg>`}
function bars(P){if(!P.length||P.every(p=>!p.v))return '<p class="m">Sin datos para mostrar todavía.</p>';const mx=Math.max(...P.map(p=>p.v),1),bw=300/P.length;
 return `<svg viewBox="0 0 320 130" width="100%">${P.map((p,i)=>{const h=p.v/mx*80,cx=10+i*bw+bw/2;return `<rect x="${10+i*bw+2}" y="${104-h}" width="${bw-4}" height="${h}" rx="3" fill="#4cc9f0"/><text x="${cx}" y="${100-h}" text-anchor="middle">${f1(p.v)}</text><text x="${cx}" y="122" text-anchor="middle">${p.l}</text>`}).join('')}</svg>`}
const dm=d=>d.slice(8)+'/'+d.slice(5,7);
/* ===== Vistas ===== */
const views={
home(){const t=new Date(),dw=t.getDay(),td=S.rt.filter(r=>(r.days||[]).includes(dw)),ym=ymd(t).slice(0,7),
 L=[...S.wk].sort((a,b)=>b.start-a.start)[0],nm=S.wk.filter(w=>w.d.startsWith(ym)).length,
 bk=S.wk.length&&(!S.cfg.lastBackup||Date.now()-S.cfg.lastBackup>2592e6);
 return `<div class="row sp"><div><div class="m">${DIA[dw]}</div><h1 style="margin:0">${fd(ymd(t))}</h1></div><button onclick="go('set')">Ajustes</button></div>
 ${S.act?`<div class="card" style="margin-top:14px"><b>Entrenamiento en curso</b><div class="m">${esc(S.act.name)}</div><button class="big p" style="margin-top:8px" onclick="go('wo',{n:'home'})">Continuar</button></div>`:''}
 <h2>Hoy</h2>${td.length?td.map(r=>`<div class="card"><b>${esc(r.name)}</b><div class="m">${r.ex.length} ejercicios</div><button class="big p" style="margin-top:8px" onclick="startRt('${r.id}')">Comenzar entrenamiento</button></div>`).join(''):`<div class="card"><p class="m" style="margin-top:0">No hay una rutina programada para hoy. Podés asignar días al editar una rutina.</p><button class="big" onclick="go('rt')">Elegir una rutina</button></div>`}
 <button class="big" onclick="startRt()">Entrenamiento libre</button>
 <h2>Último entrenamiento</h2>${L?`<div class="card" onclick="go('wkd',{id:'${L.id}',n:'hist'})"><b>${esc(L.name)}</b><div class="m">${fd(L.d)} · ${fm(L.dur)} · ${Math.round(wvol(L))} kg de volumen</div></div>`:'<div class="card m">Todavía no registraste entrenamientos.</div>'}
 <div class="card row sp"><div><div class="m">Entrenamientos este mes</div><b style="font-size:30px">${nm}</b></div><button onclick="go('prog')">Ver progreso</button></div>
 <button class="big" onclick="go('month',{m:'${ym}',n:'prog'})">Resumen mensual</button>
 ${bk?`<div class="card"><b>Hacé una copia de seguridad</b><p class="m">${S.cfg.lastBackup?'Tu última copia fue el '+fd(ymd(S.cfg.lastBackup)):'Todavía no hiciste ninguna copia.'} Tus datos viven solo en este teléfono.</p><button class="big p" onclick="exportBk()">Descargar copia ahora</button></div>`:''}`},
rt(){return `<div class="row sp"><h1>Mis rutinas</h1><button class="p" onclick="editRt()">+ Nueva</button></div>
 ${S.rt.map(r=>`<div class="card"><div class="row sp"><b>${esc(r.name)}${r.demo?'<span class="tag">EJEMPLO</span>':''}</b></div>
 <div class="m">${esc(r.tag||'')}${r.tag?' · ':''}${r.ex.length} ejercicios${(r.days||[]).length?' · '+r.days.map(d=>DIA[d].slice(0,3)).join(', '):''}${(r.imgs||[]).length?' · '+r.imgs.length+' imagen(es)':''}</div>
 <div class="row" style="margin-top:8px"><button class="p g" onclick="startRt('${r.id}')">Entrenar</button><button onclick="editRt('${r.id}')">Editar</button></div>
 <div class="row" style="margin-top:6px"><button class="g" onclick="dupRt('${r.id}')">Duplicar</button><button class="g d" onclick="delRt('${r.id}')">Eliminar</button></div></div>`).join('')||'<p class="m">No tenés rutinas. Creá una o agregá una rutina armada.</p>'}
 <h2>Rutinas armadas</h2><p class="m" style="margin-top:0">Tocá una para agregarla a tus rutinas y editarla.</p>
 ${TPL.map((t,i)=>`<div class="card row sp"><div><b>${esc(t.n)}</b><div class="m">${t.ex.length} ejercicios</div></div><button onclick="addTpl(${i})">Agregar</button></div>`).join('')}
 <button class="big" onclick="editRt(null,true)">Importar rutina desde texto o imagen</button>`},
edit(){return `<h1>${D.isNew?'Nueva rutina':'Editar rutina'}</h1>
 <input placeholder="Nombre (ej: Día 1 – Pecho)" value="${esc(D.name)}" oninput="D.name=this.value">
 <input style="margin-top:8px" placeholder="Grupo muscular o etiqueta (opcional)" value="${esc(D.tag||'')}" oninput="D.tag=this.value">
 <h2>Días programados</h2>${DIA.map((d,i)=>`<span class="chip ${D.days.includes(i)?'on':''}" onclick="tgDay(${i})">${d.slice(0,3)}</span>`).join('')}
 <h2>Ejercicios</h2>${D.ex.map(exRow).join('')||'<p class="m">Todavía no hay ejercicios. Agregalos desde la biblioteca, una rutina armada o importá un texto.</p>'}
 <div class="row" style="margin-bottom:8px"><button class="g" onclick="pickEx(addEx)">+ Biblioteca</button><button class="g" onclick="pickArm()">+ Rutina armada</button></div>
 <button class="big" onclick="impTxt()">Importar texto o imagen</button>
 ${(D.imgs||[]).length?`<h2>Imágenes de la rutina</h2>${D.imgs.map((u,i)=>/^data:image\//.test(u)?`<div style="position:relative"><img src="${u}" style="width:100%;border-radius:12px;margin:6px 0"><button class="d" style="position:absolute;right:6px;top:10px" onclick="D.imgs.splice(${i},1);render()">Quitar</button></div>`:'').join('')}`:''}
 <div style="height:10px"></div><button class="big p" onclick="saveRt()">Guardar rutina</button><button class="big" onclick="go('rt')">Cancelar</button>`},
wo(){const a=S.act;if(!a)return views.home();
 return `<div class="row sp"><h1>${esc(a.name)}</h1><span id="clk" class="m"></span></div>

let TJ=null;const abs=p=>new URL(p,location.href).href;
function loadTj(){return TJ||(TJ=new Promise((ok,no)=>{if(window.Tesseract)return ok();const s=document.createElement('script');s.src='ocr/tesseract.min.js';s.onload=ok;s.onerror=()=>{TJ=null;no(new Error('no se encontró la carpeta ocr. Subila junto con index.html'))};document.head.appendChild(s)}))}
function prep(f){return new Promise(ok=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(2,2200/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.drawImage(i,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),a=d.data;let lo=255,hi=0;for(let j=0;j<a.length;j+=4){const g=a[j]*.3+a[j+1]*.59+a[j+2]*.11;a[j]=g;if(g<lo)lo=g;if(g>hi)hi=g}const rg=(hi-lo)||1;for(let j=0;j<a.length;j+=4){const g=(a[j]-lo)/rg*255;a[j]=a[j+1]=a[j+2]=g}x.putImageData(d,0,0);URL.revokeObjectURL(u);ok(c)};i.onerror=()=>ok(null);i.src=u})}
async function ocrFile(f){if(!f)return;const say=t=>{const e=$('#ocs');if(e)e.textContent=t};let w;say('Preparando la imagen…');

  w=await Tesseract.createWorker('spa',1,{workerPath:abs('ocr/worker.min.js'),corePath:abs('ocr'),langPath:abs('ocr'),workerBlobURL:false,cacheMethod:'none',logger:m=>{if(m.status=='recognizing text')say(`Leyendo texto… ${Math.round(m.progress*100)} %`);else say('Cargando el lector de texto…')}});
  const r=await w.recognize(c),t=(r.data.text||'').trim();
  if(!t)say('No se encontró texto. Probá con una foto más nítida, de frente y con buena luz.');
  else{const ta=$('#it');if(ta)ta.value=(ta.value?ta.value+'\n':'')+t;say('Listo. Revisá el texto y corregí lo que haga falta antes de agregar los ejercicios.');
   const k=$('#ksv');if(k&&k.checked){const u=await shrink(f,1280);if(u)D.imgs.push(u)}}
 }catch(e){say('No se pudo leer el texto: '+(e&&e.message||e))}
 finally{if(w)try{await w.terminate()}catch(_){}}}
function parse(t){return t.split(/\n/).map(l=>l.replace(/[|\t]+/g,' ').replace(/^\s*(?:[-•*·]|\d+\s*[.)])\s+/,'').replace(/\s+/g,' ').trim()).filter(l=>l.length>2).map(l=>{let s=3,r=10,w=0,n=l,m,p=true;
 if(m=l.match(/(\d+)\s*[xX×*]\s*(\d+)/)){s=+m[1];r=+m[2];n=l.slice(0,m.index)}
 else if(m=l.match(/(\d+)\s*series?\s*(?:de|x)?\s*(\d+)/i)){s=+m[1];r=+m[2];n=l.slice(0,m.index)}
 else if(m=l.match(/^(.*?[a-zñáéíóúü])\s+(\d{1,2})\s+(\d{1,3})(?!\d)/i)){s=+m[2];r=+m[3];n=m[1]}
 else p=false;
 const k=l.match(/(\d+(?:[.,]\d+)?)\s*kg/i);if(k)w=num(k[1]);
 n=n.replace(/\d+([.,]\d+)?\s*kg.*$/i,'').replace(/[\s:–—\-,@(]+$/,'').trim();return n?{n,s:Math.max(1,Math.min(s,20)),r:Math.max(1,Math.min(r,100)),w,p}:null}).filter(Boolean)}
const lev=(a,b)=>{const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=t}}return d[b.length]};
function findEx(n){const q=norm(n);let e=S.ex.find(x=>norm(x.name)==q)||S.ex.find(x=>{const a=norm(x.name);return q.length>=4&&(a.includes(q)||q.includes(a))});if(e||q.length<5)return e;let b=null,bd=99;S.ex.forEach(x=>{const a=norm(x.name),d=Math.min(lev(q,a),lev(q,a.slice(0,q.length)));if(d<bd){bd=d;b=x}});return bd<=Math.max(2,Math.round(q.length*.2))?b:null}
const cap=s=>{s=s.toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)};
async function doImp(){const items=parse($('#it').value);if(!items.length)return toast('No encontré ejercicios. Escribí uno por línea, por ejemplo: Sentadilla 4x8 80kg');

 for(const it of items){let e=findEx(it.n);if(!e&&!it.p){ig.push(it.n);continue}
  if(!e){e={id:uid(),name:cap(it.n),group:'Otros',muscles:'',desc:'',errors:'',custom:true};await sv('ex',e);S.ex.push(e);nw++}
  D.ex.push({eid:e.id,n:e.name,s:it.s,r:it.r,w:it.w});ad++}
 closeM();render();
 toast(`Se agregaron ${ad} ejercicio(s).`+(nw?`\n${nw} no estaban en la biblioteca y se crearon en el grupo Otros.`:'')+(ig.length?`\nSe ignoraron ${ig.length} línea(s) sin series ni repeticiones: ${ig.slice(0,4).join(' / ')}${ig.length>4?'…':''}`:'')+'\nRevisá series, repeticiones y pesos antes de guardar.')}

/* ===== Entrenamiento ===== */
const sa=()=>sv('meta',S.act);
function lastSets(eid){if(!eid)return null;const L=[...S.wk].sort((a,b)=>b.start-a.start);for(const w of L){const e=w.ex.find(x=>x.eid==eid&&x.sets.some(s=>s.done));if(e)return{sets:e.sets.filter(s=>s.done),pm:e.pm,d:w.d}}return null}
function mkAx(x){const pv=lastSets(x.eid),ps=pv?pv.sets:[];return{eid:x.eid,n:x.n,s:x.s,r:x.r,w:x.w,pm:pv?!!pv.pm:false,note:'',sets:Array.from({length:x.s||3},(_,j)=>{const p=ps[j]||ps[ps.length-1];return{w:p?p.w:(x.w||''),r:x.r||'',done:false}})}}
function startRt(id){if(S.act&&!confirm('Ya hay un entrenamiento en curso. ¿Reemplazarlo por uno nuevo?'))return go('wo',{n:'home'});

function exCard(e,i){const pv=lastSets(e.eid);
 return `<div class="card"><div class="row sp"><b>${esc(e.n)}</b><button class="d" style="min-height:38px" onclick="rmAct(${i})">✕</button></div>
 <div class="m">Objetivo: ${e.s}×${e.r}${e.w?' · '+e.w+' kg':''}</div>
 <div class="m">${pv?`Última vez (${fd(pv.d)}): ${pv.sets.map(s=>f1(s.w)+'×'+s.r).join(', ')}${pv.pm?' (por mancuerna)':''}`:'Sin registros anteriores de este ejercicio.'}</div>
 <label class="row m" style="margin:8px 0"><input type="checkbox" style="width:24px;min-height:24px" ${e.pm?'checked':''} onchange="S.act.ex[${i}].pm=this.checked;sa()"> Peso por cada mancuerna (no el total)</label>
 ${e.sets.map((s,j)=>`<div class="set"><span class="m">${j+1}</span><input inputmode="decimal" placeholder="kg" value="${s.w}" onchange="ss(${i},${j},'w',this.value)"><input inputmode="numeric" placeholder="reps" value="${s.r}" onchange="ss(${i},${j},'r',this.value)"><button class="${s.done?'ok':''}" onclick="tg(${i},${j})">✓</button></div>`).join('')}
 <div class="row" style="margin:8px 0"><button class="g" onclick="addSet(${i})">+ Serie</button><button class="g" onclick="rmSet(${i})">− Serie</button></div>
 <input placeholder="Notas (opcional)" value="${esc(e.note||'')}" onchange="S.act.ex[${i}].note=this.value;sa()"></div>`}
function ss(i,j,k,v){S.act.ex[i].sets[j][k]=v===''?'':(k=='r'?Math.floor(num(v)):num(v));sa()}
function tg(i,j){const s=S.act.ex[i].sets[j];if(!s.done&&!(num(s.r)>0))return toast('Ingresá las repeticiones antes de marcar la serie.');
 s.done=!s.done;sa();render();if(s.done&&S.act.rest)R.end=Date.now()+S.act.rest*1000}
function addSet(i){const e=S.act.ex[i],l=e.sets[e.sets.length-1]||{w:'',r:''};e.sets.push({w:l.w,r:l.r,done:false});sa();render()}
function rmSet(i){const e=S.act.ex[i];if(e.sets.length>1){e.sets.pop();sa();render()}}

const addToAct=ids=>{ids.forEach(id=>{const e=exOf(id);if(e)S.act.ex.push(mkAx({eid:id,n:e.name,s:3,r:10,w:0}))});sa();render()};
async function finish(){const a=S.act,ex=a.ex.map(e=>({eid:e.eid,n:e.n,pm:!!e.pm,note:e.note||'',sets:e.sets.map(s=>({w:num(s.w),r:num(s.r),done:!!s.done}))})).filter(e=>e.sets.some(s=>s.done)||e.note);
 if(!ex.some(e=>e.sets.some(s=>s.done))&&!confirm('No marcaste ninguna serie como completada. ¿Guardar igual?'))return;
 const now=Date.now(),w={id:uid(),d:ymd(a.start),start:a.start,dur:Math.round((now-a.start)/1000),rid:a.rid,name:a.name,note:'',ex};
 try{await put('wk',w)}catch(e){return toast('No se pudo guardar el entrenamiento: '+e.message+'. Tu sesión sigue abierta; probá de nuevo.')}
 S.wk.push(w);const r=a.rid&&S.rt.find(x=>x.id==a.rid);
 if(r&&JSON.stringify(r.ex.map(e=>e.eid||e.n))!=JSON.stringify(a.ex.map(e=>e.eid||e.n))&&confirm('Cambiaste los ejercicios durante el entrenamiento. ¿Querés actualizar la rutina con esos cambios?')){r.ex=a.ex.map(e=>({eid:e.eid,n:e.n,s:e.sets.length,r:e.r,w:e.w}));await sv('rt',r)}
 await del('meta','act');S.act=null;R.end=0;go('wkd',{id:w.id,n:'hist'})}

/* ===== Resumen mensual ===== */
function bestOf(R,ym){const o={};R.filter(x=>x.d.startsWith(ym)).forEach(x=>{const b=o[x.eid]||(o[x.eid]={n:x.n,w:0,r:0,c:0,ses:new Set()});b.c++;b.ses.add(x.wid);if(x.w>b.w||(x.w==b.w&&x.r>b.r)){b.w=x.w;b.r=x.r}});return o}
function mrep(ym,cmp){const R0=rows(),W=S.wk.filter(w=>w.d.startsWith(ym)),Wp=S.wk.filter(w=>w.d.startsWith(cmp)),cur=bestOf(R0,ym),prv=bestOf(R0,cmp);
 const rm=R0.filter(x=>x.d.startsWith(ym)),vol=rm.reduce((a,x)=>a+x.v,0),pvol=R0.filter(x=>x.d.startsWith(cmp)).reduce((a,x)=>a+x.v,0);
 const gm={};rm.forEach(x=>gm[x.g]=(gm[x.g]||0)+1);const rtm={};W.forEach(w=>rtm[w.name]=(rtm[w.name]||0)+1);
 const wm={};rm.forEach(x=>{const k=monday(x.d);wm[k]=(wm[k]||0)+x.v});
 const ids=Object.keys(cur).sort((a,b)=>cur[b].c-cur[a].c);
 const st={};ids.forEach(id=>{const c=cur[id],p=prv[id];st[id]=!p||c.ses.size<2?{k:'i',s:'Sin datos suficientes para comparar'}:c.w>p.w?{k:'u',s:`Mejoró: mejor peso ${f1(p.w)} → ${f1(c.w)} kg`,a:p.w,b:c.w}:(c.w==p.w&&c.r>p.r)?{k:'u',s:`Mejoró: más repeticiones con ${f1(c.w)} kg (${p.r} → ${c.r})`}:{k:'f',s:'Sin progreso evidente'}});
 const prs=[];ids.forEach(id=>{const old=R0.filter(x=>x.eid==id&&x.d<ym+'-01');if(old.length){const o=Math.max(...old.map(x=>x.w));if(cur[id].w>o)prs.push({n:cur[id].n,w:cur[id].w,old:o})}});
 const mn=mname(ym).split(' de ')[0],pn=mname(cmp).split(' de ')[0],paras=[];
 paras.push(W.length?`Durante ${mn} realizaste ${W.length} entrenamiento${W.length==1?'':'s'}${Wp.length?`, frente a ${Wp.length} en ${pn}`:`. No hay entrenamientos registrados en ${pn} para comparar`}.`:`No hay entrenamientos registrados en ${mname(ym)}.`);
 ids.slice(0,4).forEach(id=>{const s=st[id],n=cur[id].n;paras.push(s.k=='u'&&s.a!=null?`En ${n}, aumentaste tu mejor peso registrado de ${f1(s.a)} kg a ${f1(s.b)} kg.`:s.k=='u'?`En ${n}, ${s.s.toLowerCase().replace('mejoró: ','mejoraste: ')}.`:s.k=='f'?`En ${n} no hay un progreso evidente respecto a ${pn}.`:`No hay suficientes registros de ${n} para determinar una tendencia.`)});
 if(vol&&pvol){const pc=Math.round((vol-pvol)/pvol*100);paras.push(pc==0?`Tu volumen total registrado se mantuvo igual que en ${pn}.`:`Tu volumen total registrado ${pc>0?'aumentó':'disminuyó'} un ${Math.abs(pc)} % respecto a ${pn}. El volumen por sí solo no indica mejora.`)}else if(vol)paras.push(`No hay volumen registrado en ${pn} para comparar.`);
 if(prs.length)paras.push(`Nuevos récords de peso: ${prs.map(p=>p.n).join(', ')}.`);
 return{n:W.length,days:new Set(W.map(w=>w.d)).size,vol,pvol,paras,prs,table:ids.slice(0,10).map(id=>({n:cur[id].n,s:st[id].s})),groups:Object.entries(gm).sort((a,b)=>b[1]-a[1]).slice(0,3),routines:Object.entries(rtm).sort((a,b)=>b[1]-a[1]).slice(0,3),weeks:Object.keys(wm).sort().map(k=>({l:dm(k),v:Math.round(wm[k])}))}}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),800)}
